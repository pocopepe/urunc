name: Run fuzz tests

on:
  workflow_call:
    inputs:
      ref:
        type: string
        default: ''
        required: true
      go_version:
        required: true
        type: string
      fuzztime:
        description: How long each Fuzz target searches for new failures, after replaying its seed corpus
        required: false
        type: string
        default: '20s'

permissions:
  contents: read
  pull-requests: read

jobs:
  fuzz-test:
    name: fuzz-test
    runs-on: ubuntu-22.04
    continue-on-error: true

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@ec9f2d5744a09debf3a187a3f4f675c53b671911 # v2.13.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: ${{ inputs.go_version }}
          cache: false

      - name: Run Fuzz targets (seed corpus replay + short search)
        run: make fuzz FUZZTIME=${{ inputs.fuzztime }}
